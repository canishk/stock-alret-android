name: Build Debug APK

on:
  push:
    branches:
      - cursor/stock-price-alert-android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}" >> local.properties

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-price-alert-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  publish-main:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: stock-price-alert-debug
          path: artifact

      - name: Push APK to orphan main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p releases
          cp artifact/app-debug.apk releases/stock-price-alert-debug.apk
          cp .github/main-README.md README.md
          git checkout --orphan main
          git reset --hard
          git add -f releases/stock-price-alert-debug.apk README.md
          git commit -m "Update debug APK and README from CI build ${GITHUB_SHA:0:7}"
          git push -f origin main
