name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Verify RAPIDAPI_KEY secret
        run: |
          if [ -z "${{ secrets.RAPIDAPI_KEY }}" ]; then
            echo "RAPIDAPI_KEY secret is missing. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          echo "RAPIDAPI_KEY is configured."

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}" >> local.properties

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Package APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "stock-price-alert-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: stock-price-alert-*.apk
          generate_release_notes: true
